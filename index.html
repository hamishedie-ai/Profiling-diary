<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diary">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Profiling Diary</title>
<style>
  :root { --teal:#0f766e; --ink:#1c1917; --mut:#78716c; --bg:#f5f5f4; --card:#fff; --line:#e7e5e4; --ok:#15803d; --warn:#b45309; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.4 -apple-system,system-ui,sans-serif; color:var(--ink); background:var(--bg);
         padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 16px); }
  header { background:var(--teal); color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:18px; }
  header button { background:none; border:0; color:#ccfbf1; font-size:14px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--mut); margin-bottom:4px; }
  input, textarea { width:100%; font:inherit; padding:11px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  textarea { min-height:170px; resize:vertical; }
  button.primary { width:100%; padding:14px; border:0; border-radius:12px; background:var(--teal); color:#fff; font:600 16px inherit; }
  button.ghost { padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; font:inherit; }
  button:disabled { opacity:.5; }
  .seg { display:flex; background:#e7e5e4; border-radius:10px; padding:3px; margin-bottom:14px; }
  .seg button { flex:1; padding:9px; border:0; background:none; border-radius:8px; font:inherit; color:var(--mut); }
  .seg button.on { background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 2px #0002; }
  #mic { width:92px; height:92px; border-radius:50%; border:0; background:var(--teal); color:#fff; font-size:38px; display:block; margin:6px auto 4px; }
  #mic.rec { background:#dc2626; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 14px #dc262633; } }
  .hint { text-align:center; color:var(--mut); font-size:13px; margin:0 0 12px; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 0; }
  .thumbs img { width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .day { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .day:last-child { border:0; }
  .day small { color:var(--mut); display:block; max-width:300px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill { font-size:12px; padding:3px 9px; border-radius:99px; background:#e7e5e4; color:var(--mut); }
  .pill.has { background:#dcfce7; color:var(--ok); }
  .pill.conf { background:#ccfbf1; color:var(--teal); }
  #msg { text-align:center; min-height:20px; font-size:14px; color:var(--mut); margin-top:8px; }
  .err { color:#b91c1c !important; }
  #keyCard { position:fixed; inset:0; z-index:50; background:#0008; display:flex; align-items:center; justify-content:center; padding:20px; margin:0; border:0; border-radius:0; }
  #keyCard .box { background:#fff; border-radius:16px; padding:18px; width:100%; max-width:420px; }
  #keyCard h2 { margin:0 0 6px; font-size:18px; }
  #keyCard p { margin:0 0 12px; color:var(--mut); font-size:14px; }
  .hide { display:none !important; }
</style>
</head>
<body>
<header><h1>Profiling Diary</h1><button id="signout" class="hide">Sign out</button></header>
<main>

<section id="auth" class="card hide">
  <div class="seg"><button id="tabIn" class="on">Sign in</button><button id="tabUp">Create account</button></div>
  <label for="email">Email</label><input id="email" type="email" autocomplete="email" inputmode="email">
  <div style="height:10px"></div>
  <label for="pw">Password (8+ characters)</label><input id="pw" type="password" autocomplete="current-password">
  <div style="height:14px"></div>
  <button id="authGo" class="primary">Sign in</button>
</section>

<section id="app" class="hide">
  <div class="seg"><button id="vToday" class="on">Today</button><button id="vWeek">This week</button></div>

  <div id="viewToday">
    <div class="card">
      <label for="date">Day</label>
      <input id="date" type="date">
      <div style="height:6px"></div>
      <button id="mic" aria-label="Record">🎙</button>
      <p class="hint" id="micHint">Tap and say what you did today</p>
      <label for="text">What you did</label>
      <textarea id="text" placeholder="Tap the mic, or use your keyboard's dictation key"></textarea>
      <div class="thumbs" id="thumbs"></div>
      <div style="height:10px"></div>
      <label class="ghost" style="display:block;text-align:center;color:var(--ink);margin:0">📷 Add photos
        <input id="photos" type="file" accept="image/*" multiple class="hide">
      </label>
    </div>
    <div class="hide" id="keyCard" role="dialog" aria-modal="true" aria-labelledby="keyTitle">
      <div class="box">
        <h2 id="keyTitle">Add your Gemini key</h2>
        <p>Add your Gemini key to have accurate voice recordings. It's free, and it stays on this phone. Your recording is sent to Google to be turned into text.</p>
        <label for="keyIn">Gemini key</label>
        <input id="keyIn" type="password" autocomplete="off" placeholder="Paste your key here">
        <p style="margin:8px 0 12px"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--teal);font-weight:600">Get a free key here</a></p>
        <button class="primary" id="saveKey">Save key</button>
        <div style="height:8px"></div>
        <button class="ghost" id="keyCancel" style="width:100%">Not now</button>
      </div>
    </div>
    <button id="save" class="primary">Save day</button>
    <p class="hint" style="margin-top:10px"><a href="#" id="keyLink" onclick="return false" style="color:var(--mut)">Voice key</a></p>
  </div>

  <div id="viewWeek" class="hide">
    <div class="card" id="weekList"></div>
    <p class="hint" id="weekTotals"></p>
  </div>

  <div id="msg"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ulokjhbjcmbpaxdkmbui.supabase.co";
const SUPABASE_KEY = "sb_publishable_rF-n0MwPJBZlXJlEAJhFPg_u_xyQXEn";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let user = null, signUpMode = false, pending = [];

const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mondayOf = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
function msg(t, err) { $("msg").textContent = t || ""; $("msg").className = err ? "err" : ""; }

/* ---------- auth ---------- */
$("tabIn").onclick = () => setMode(false);
$("tabUp").onclick = () => setMode(true);
function setMode(up) {
  signUpMode = up;
  $("tabIn").classList.toggle("on", !up); $("tabUp").classList.toggle("on", up);
  $("authGo").textContent = up ? "Create account" : "Sign in";
  $("pw").autocomplete = up ? "new-password" : "current-password";
}
$("authGo").onclick = async () => {
  msg("");
  const email = $("email").value.trim(), password = $("pw").value;
  if (!email || password.length < 8) return msg("Enter an email and a password of 8+ characters.", true);
  $("authGo").disabled = true;
  const { data, error } = signUpMode
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  $("authGo").disabled = false;
  if (error) return msg(error.message, true);
  if (signUpMode && !data.session) return msg("Account created. Check your email to confirm, then sign in.");
  boot();
};
$("signout").onclick = async () => { await sb.auth.signOut(); boot(); };

async function boot() {
  const { data } = await sb.auth.getSession();
  user = data.session ? data.session.user : null;
  $("auth").classList.toggle("hide", !!user);
  $("app").classList.toggle("hide", !user);
  $("signout").classList.toggle("hide", !user);
  if (user) { $("date").value = iso(new Date()); await loadDay(); }
}

/* ---------- views ---------- */
function show(v) {
  $("vToday").classList.toggle("on", v==="today"); $("vWeek").classList.toggle("on", v==="week");
  $("viewToday").classList.toggle("hide", v!=="today"); $("viewWeek").classList.toggle("hide", v!=="week");
  if (v==="week") loadWeek();
}
$("vToday").onclick = () => show("today");
$("vWeek").onclick = () => show("week");
$("date").onchange = loadDay;

/* ---------- voice: record, then Gemini writes it out ---------- */
const GEMINI_MODELS = ["gemini-2.5-flash", "gemini-flash-latest"];
const getKey = () => { try { return localStorage.getItem("geminiKey") || ""; } catch (e) { return ""; } };
let mediaRec = null, chunks = [], micStream = null, recTimer = null, busyVoice = false;
$("saveKey").onclick = () => {
  const k = $("keyIn").value.trim();
  if (!k) return;
  try { localStorage.setItem("geminiKey", k); } catch (e) { return msg("Couldn't save the key on this phone.", true); }
  $("keyIn").value = ""; $("keyCard").classList.add("hide"); msg("Key saved. Tap the mic and talk.");
};
$("mic").onclick = () => {
  if (busyVoice) return;
  if (!getKey()) { $("keyCard").classList.remove("hide"); return; }
  mediaRec && mediaRec.state === "recording" ? stopRec() : startRec();
};
async function startRec() {
  if (!navigator.mediaDevices || !window.MediaRecorder) return msg("Recording isn't available here. Tap the text box and use the keyboard's microphone key.", true);
  try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { return msg("Microphone blocked. Allow it in Settings, or use the keyboard's microphone key.", true); }
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  chunks = [];
  mediaRec = new MediaRecorder(micStream, type ? { mimeType: type } : undefined);
  mediaRec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mediaRec.onstop = () => transcribe(new Blob(chunks, { type: mediaRec.mimeType || type || "audio/mp4" }));
  mediaRec.start();
  setRec(true); msg("");
  recTimer = setTimeout(stopRec, 5 * 60 * 1000);
}
function stopRec() {
  clearTimeout(recTimer);
  if (mediaRec && mediaRec.state === "recording") mediaRec.stop();
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  setRec(false);
}
const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
// Turns whatever the phone recorded into a small 16 kHz mono WAV, which Gemini reads reliably.
async function toWav(blob) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  try {
    const ab = await blob.arrayBuffer();
    const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
    const rate = 16000, len = Math.max(1, Math.round(buf.duration * rate));
    const off = new OfflineAudioContext(1, len, rate);
    const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
    const pcm = (await off.startRendering()).getChannelData(0);
    const out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
    const w = (o, s) => { for (let k = 0; k < s.length; k++) out.setUint8(o + k, s.charCodeAt(k)); };
    w(0, "RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVEfmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
    out.setUint32(24, rate, true); out.setUint32(28, rate * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, "data"); out.setUint32(40, pcm.length * 2, true);
    for (let k = 0; k < pcm.length; k++) out.setInt16(44 + k * 2, Math.max(-1, Math.min(1, pcm[k])) * 32767, true);
    return new Blob([out], { type: "audio/wav" });
  } finally { ctx.close && ctx.close(); }
}
async function transcribe(blob) {
  if (!blob.size) return msg("Didn't catch any sound. Try again.", true);
  busyVoice = true; $("micHint").textContent = "Writing it out…"; $("mic").disabled = true;
  if (blob.size > 14 * 1048576) { busyVoice = false; $("mic").disabled = false; setRec(false); return msg("That recording is too long. Try shorter ones (a few minutes each).", true); }
  try {
    $("micHint").textContent = "Preparing the recording…";
    try { blob = await toWav(blob); } catch (e) { /* send it as recorded instead */ }
    const data = await toB64(blob);
    const mime = (blob.type || "audio/mp4").split(";")[0];
    const prompt = "Transcribe this audio exactly as spoken. The speaker is an Australian electrical apprentice describing their work day, so expect trade words (e.g. downlights, RCD, switchboard, conduit, PVC, TPS cable, terminate, isolate, LV, ELV, GPO, MCB, earth, neutral, active). Use Australian English spelling, add normal punctuation and paragraphs, and do not add, explain or summarise anything. Output only the transcript. If there is no speech, output nothing.";
    let text = null, lastErr = "";
    const mb = (blob.size / 1048576).toFixed(1);
    for (const m of GEMINI_MODELS) {
      let res;
      for (const thinkOff of [true, false]) {
        const ctl = new AbortController();
        const t0 = Date.now();
        const tick = setInterval(() => { $("micHint").textContent = `Writing it out… ${Math.round((Date.now() - t0) / 1000)}s (${mb} MB sent)`; }, 1000);
        const timer = setTimeout(() => ctl.abort(), window.VOICE_TIMEOUT_MS || 60000);
        try {
          res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {
            method: "POST",
            signal: ctl.signal,
            headers: { "Content-Type": "application/json", "x-goog-api-key": getKey() },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: mime, data } }] }], generationConfig: { temperature: 0, ...(thinkOff ? { thinkingConfig: { thinkingBudget: 0 } } : {}) } }),
          });
        } catch (e) {
          if (e.name === "AbortError") throw new Error(`Gemini took too long (over a minute) for a ${mb} MB recording. Try a shorter recording, or check your signal.`);
          throw e;
        } finally {
          clearTimeout(timer); clearInterval(tick);
        }
        if (res.status === 400 && thinkOff) {
          const t = await res.clone().text();
          if (/think/i.test(t)) continue; // this model doesn't take that setting, retry without it
        }
        break;
      }
      if (res.status === 404) { lastErr = "model"; continue; }
      if (res.status === 429) throw new Error("Gemini's free limit was hit. Wait a minute and try again.");
      if (res.status === 400 || res.status === 403) {
        let j = {}; try { j = await res.json(); } catch (e) {}
        const em = (j.error && j.error.message) || "";
        throw new Error(/API key/i.test(em) ? "That Gemini key was refused. Tap Voice key below to paste it again." : "Gemini couldn't read the recording: " + em.slice(0, 120));
      }
      if (!res.ok) throw new Error("Gemini didn't answer (error " + res.status + ").");
      const j = await res.json();
      text = ((j.candidates || [])[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
      break;
    }
    if (text === null) throw new Error("Couldn't find a Gemini model that works. " + lastErr);
    if (!text) throw new Error("Didn't catch any speech. Try again, closer to the mic.");
    const cur = $("text").value.trim();
    $("text").value = cur ? cur + "\n\n" + text : text;
    msg("Added. Check it reads right, then Save day.");
  } catch (e) {
    msg(e.name === "TypeError" ? "No internet connection." : e.message, true);
    if (/refused/.test(e.message)) $("keyCard").classList.remove("hide");
  } finally {
    busyVoice = false; $("mic").disabled = false; setRec(false);
  }
}
function setRec(on) {
  $("mic").classList.toggle("rec", on);
  $("micHint").textContent = on ? "Recording… tap to stop" : "Tap and say what you did today";
}
$("keyLink").onclick = () => $("keyCard").classList.remove("hide");
$("keyCancel").onclick = () => $("keyCard").classList.add("hide");

/* ---------- photos ---------- */
$("photos").onchange = async e => {
  for (const f of e.target.files) {
    const blob = await shrink(f);
    pending.push(blob);
    const img = new Image(); img.src = URL.createObjectURL(blob); $("thumbs").appendChild(img);
  }
  e.target.value = "";
};
function shrink(file, max = 1600) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), "image/jpeg", 0.82);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- data ---------- */
async function loadDay() {
  pending = []; $("thumbs").innerHTML = ""; msg("");
  const { data, error } = await sb.from("daily_entries").select("id, transcript, status").eq("entry_date", $("date").value).maybeSingle();
  if (error) return msg(error.message, true);
  $("text").value = data ? (data.transcript || "") : "";
  if (data) {
    const { data: ph } = await sb.from("entry_photos").select("storage_path").eq("entry_id", data.id);
    if (ph && ph.length) {
      const { data: urls } = await sb.storage.from("profiling-photos").createSignedUrls(ph.map(p => p.storage_path), 3600);
      (urls || []).forEach(u => { if (u.signedUrl) { const i = new Image(); i.src = u.signedUrl; $("thumbs").appendChild(i); } });
    }
  }
}

$("save").onclick = async () => {
  const text = $("text").value.trim(), day = $("date").value;
  if (!text && !pending.length) return msg("Nothing to save yet.", true);
  if (busyVoice || (mediaRec && mediaRec.state === "recording")) return msg("Finish the recording first (tap the mic to stop).", true);
  $("save").disabled = true; msg("Saving…");
  try {
    const { data: entry, error } = await sb.from("daily_entries")
      .upsert({ user_id: user.id, entry_date: day, transcript: text, status: "draft" }, { onConflict: "user_id,entry_date" })
      .select("id").single();
    if (error) throw error;
    for (const blob of pending) {
      const path = `${user.id}/${day}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
      const up = await sb.storage.from("profiling-photos").upload(path, blob, { contentType: "image/jpeg" });
      if (up.error) throw up.error;
      const ins = await sb.from("entry_photos").insert({ entry_id: entry.id, user_id: user.id, storage_path: path });
      if (ins.error) throw ins.error;
    }
    pending = []; msg("Saved ✓"); await loadDay(); msg("Saved ✓");
  } catch (e) { msg("Couldn't save: " + e.message, true); }
  $("save").disabled = false;
};

async function loadWeek() {
  const mon = mondayOf(new Date()), days = [...Array(7)].map((_, i) => { const d = new Date(mon); d.setDate(d.getDate()+i); return d; });
  const { data, error } = await sb.from("daily_entries").select("entry_date, transcript, status")
    .gte("entry_date", iso(days[0])).lte("entry_date", iso(days[6]));
  if (error) return msg(error.message, true);
  const by = Object.fromEntries((data || []).map(r => [r.entry_date, r]));
  let n = 0;
  $("weekList").innerHTML = days.map(d => {
    const r = by[iso(d)]; if (r) n++;
    const label = d.toLocaleDateString("en-AU", { weekday:"long", day:"numeric", month:"short" });
    const pill = r ? `<span class="pill ${r.status==='confirmed'?'conf':'has'}">${r.status==='confirmed'?'confirmed':'logged'}</span>` : `<span class="pill">empty</span>`;
    const snip = r && r.transcript ? r.transcript.replace(/[<>&]/g, "") : "";
    return `<div class="day" data-d="${iso(d)}"><div>${label}<small>${snip}</small></div>${pill}</div>`;
  }).join("");
  $("weekTotals").textContent = `${n} of 7 days logged`;
  document.querySelectorAll(".day").forEach(el => el.onclick = () => { $("date").value = el.dataset.d; show("today"); loadDay(); });
}

boot();
</script>
</body>
</html>
